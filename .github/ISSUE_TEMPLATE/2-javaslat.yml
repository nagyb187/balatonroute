name: 💡 Javaslat / visszajelzés
description: Ötlet, kérés vagy vélemény a tervezőről.
title: "[Javaslat] "
labels: ["javaslat"]
body:
  - type: markdown
    attributes:
      value: |
        A jegy **nyilvános**, ne írj bele személyes adatot.
        GitHub-fiók nélkül is beküldheted a [balatonrouting.hu](https://balatonrouting.hu/#visszajelzes) **Visszajelzés** űrlapján, vagy írj: info@nbsailing.hu
  - type: textarea
    id: javaslat
    attributes:
      label: Mit javasolsz, vagy mi a véleményed?
    validations:
      required: true
  - type: textarea
    id: miert
    attributes:
      label: Miben segítene? Mikor használnád?
      placeholder: pl. Kékszalagon a bóják közötti szakaszokat tervezném.
    validations:
      required: false
  - type: checkboxes
    id: nyilvanos
    attributes:
      label: Nyilvánosság
      options:
        - label: Megértettem, hogy ez a jegy nyilvános lesz.
          required: true
